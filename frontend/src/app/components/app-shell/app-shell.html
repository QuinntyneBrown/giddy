<a giddy-skip-link mainId="main-content">Skip to content</a>
@if (session(); as parent) {
  <div class="sidebar-layout">
    <nav
      giddy-sidebar-nav
      aria-label="Primary"
      ctaLabel="Plan a party"
      ctaLink="/parties/new"
      [groups]="sidebarGroups"
    ></nav>
    <div class="shell__body">
      <header
        giddy-top-bar
        brandOnSmallScreensOnly
        searchLabel="Search venues, fun and food"
        searchPlaceholder="Search venues, entertainers, cakes…"
        (searched)="search($event)"
      >
        <ng-container *ngTemplateOutlet="themeToggle" />
        <a
          giddy-avatar
          size="sm"
          class="topbar__me"
          routerLink="/settings"
          [name]="parent.name"
          [attr.aria-label]="'Account settings for ' + parent.name"
        ></a>
      </header>
      <ng-container *ngTemplateOutlet="content" />
    </div>
  </div>
  <nav giddy-bottom-nav aria-label="Primary, mobile" [items]="bottomItems" [ctaIndex]="2"></nav>
  <giddy-live-rsvp-toasts />
} @else {
  <header giddy-top-bar>
    <ng-container *ngTemplateOutlet="themeToggle" />
    <a giddy-button size="sm" routerLink="/sign-in">Sign in</a>
  </header>
  <ng-container *ngTemplateOutlet="content" />
}

<ng-template #themeToggle>
  <button
    giddy-button
    type="button"
    variant="ghost"
    iconOnly
    aria-label="Dark theme"
    [pressed]="themeService.theme() === 'dark'"
    (click)="themeService.toggle()"
  >
    <svg giddy-icon="moon"></svg>
  </button>
</ng-template>

<ng-template #content>
  @if (!connection.online()) {
    <div class="offline-banner">
      <div giddy-alert banner tone="warning" heading="You’re offline">
        <div>Giddy will reconnect on its own. Booking and invites need a connection.</div>
      </div>
    </div>
  } @else if (connection.reconnected()) {
    <div class="offline-banner">
      <div
        giddy-alert
        banner
        dismissible
        tone="success"
        heading="Back online"
        (dismissed)="connection.acknowledgeReconnected()"
      >
        <div>You’re connected again.</div>
      </div>
    </div>
  }
  <main id="main-content" class="container" tabindex="-1"><ng-content /></main>
  <footer
    giddy-footer
    text="© 2026 Giddy · Made with confetti in Toronto"
    [links]="footerLinks"
  ></footer>
</ng-template>
