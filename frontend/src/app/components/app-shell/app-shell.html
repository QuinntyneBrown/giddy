<a giddy-skip-link mainId="main-content"></a>
<div class="sidebar-layout">
  <nav
    giddy-sidebar-nav
    aria-label="Primary"
    ctaLabel="Plan a party"
    ctaLink="/parties/new"
    [groups]="sidebarGroups"
  ></nav>
  <div class="shell__body">
    <header
      giddy-top-bar
      brandOnSmallScreensOnly
      searchLabel="Search venues, fun and food"
      searchPlaceholder="Search venues, entertainers, cakes…"
      (searched)="search($event)"
    >
      <button
        giddy-button
        type="button"
        variant="ghost"
        iconOnly
        aria-label="Dark theme"
        [pressed]="themeService.theme() === 'dark'"
        (click)="themeService.toggle()"
      >
        <svg giddy-icon="moon"></svg>
      </button>
    </header>
    <main id="main-content" class="container" tabindex="-1"><ng-content /></main>
    <footer
      giddy-footer
      text="© 2026 Giddy · Made with confetti in Toronto"
      [links]="footerLinks"
    ></footer>
  </div>
</div>
<nav giddy-bottom-nav aria-label="Primary, mobile" [items]="bottomItems" [ctaIndex]="2"></nav>
