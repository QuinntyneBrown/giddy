<giddy-dialog
  heading="Change your email"
  [description]="
    'We’ll send a link to the new address. Until you open it, you keep signing in with ' +
    current +
    '.'
  "
  [busy]="busy()"
>
  @if (problem(); as message) {
    <div giddy-alert tone="danger" heading="Nothing was sent">
      <div>{{ message }}</div>
    </div>
  }
  @if (error(); as message) {
    <giddy-error-summary [errors]="[{ targetId: 'change-email', message }]" />
  }
  <form novalidate (submit)="$event.preventDefault(); send()">
    <giddy-form-field
      label="New email"
      inputId="change-email"
      help="We’ll also let your current address know."
      [error]="error()"
    >
      <input
        giddyInput
        type="email"
        autocomplete="email"
        data-initial-focus
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </giddy-form-field>
  </form>
  <button giddyDialogFooter giddy-button type="button" (click)="cancel()">Cancel</button>
  <button
    giddyDialogFooter
    giddy-button
    variant="primary"
    type="button"
    [busy]="busy()"
    [disabled]="busy()"
    (click)="send()"
  >
    Send confirmation link
  </button>
</giddy-dialog>
