@if (mood() === 'party') {
  <svg:path class="hat" d="M24 9 32 -6 40 9z" transform="translate(0 4)" />
  <svg:circle class="hat-dot" cx="32" cy="-1" r="2.5" />
}
<svg:path
  class="balloon"
  d="M32 4C19 4 10 13.5 10 26c0 14 12 24 22 24s22-10 22-24C54 13.5 45 4 32 4z"
/>
<svg:ellipse class="shine" cx="21" cy="16" rx="4" ry="7" transform="rotate(-25 21 16)" />
<svg:circle class="cheek" cx="20" cy="33" r="3.5" />
<svg:circle class="cheek" cx="44" cy="33" r="3.5" />
@switch (mood()) {
  @case ('sleepy') {
    <svg:path class="smile" d="M22 27h6M36 27h6" />
    <svg:path class="smile" d="M29 37c2 1.5 4 1.5 6 0" />
  }
  @case ('worried') {
    <svg:circle class="face" cx="25" cy="27" r="2.6" />
    <svg:circle class="face" cx="39" cy="27" r="2.6" />
    <svg:path class="smile" d="M26 38c3-3 9-3 12 0" />

  @default {
    <svg:circle class="face" cx="25" cy="26" r="2.8" />

    <svg:path class="smile" d="M24 34c4 5 12 5 16 0" />
  }
