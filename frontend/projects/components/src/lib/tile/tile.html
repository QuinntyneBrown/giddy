@if (link(); as to) {
  <a
    class="tile__art"
    tabindex="-1"
    aria-hidden="true"
    [routerLink]="to"
    [queryParams]="queryParams()"
  >
    <ng-container *ngTemplateOutlet="art" />
  </a>
} @else {
  <div class="tile__art"><ng-container *ngTemplateOutlet="art" /></div>
}
<ng-template #art>
  @if (badge(); as text) {
    <giddy-badge class="tile__badge" [tone]="badgeTone()">{{ text }}</giddy-badge>
  }
  <span class="emoji" aria-hidden="true">{{ emoji() }}</span>
</ng-template>
<ng-template #title>
  @if (link(); as to) {
    <a class="tile__link" [routerLink]="to" [queryParams]="queryParams()">{{ heading() }}</a>
  } @else {
    {{ heading() }}
  }
</ng-template>
<div class="tile__body">
  <div class="cluster cluster--between tile__head">
    @if (headingLevel() === 3) {
      <h3 class="tile__title" [id]="headingId"><ng-container *ngTemplateOutlet="title" /></h3>
    } @else {
      <h2 class="tile__title" [id]="headingId"><ng-container *ngTemplateOutlet="title" /></h2>
    }
    <ng-content select="[giddyTileAside]" />
  </div>
  <ng-content />
  <div class="tile__footer"><ng-content select="[giddyTileFooter]" /></div>
</div>
