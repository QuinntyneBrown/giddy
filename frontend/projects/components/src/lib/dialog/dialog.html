<div
  class="dialog__panel"
  [class.dialog__panel--lg]="size() === 'lg'"
  [class.dialog__panel--sm]="size() === 'sm'"
>
  <div class="dialog__header">
    <div class="dialog__icon" [class]="'dialog__icon--' + tone()" aria-hidden="true">
      <svg [giddy-icon]="tone() === 'danger' ? 'alert' : 'sparkle'"></svg>
    </div>
    <div class="dialog__heading">
      <h2 class="dialog__title" [id]="titleId">{{ heading() }}</h2>
      @if (description(); as text) {
        <p class="text-muted dialog__description" [id]="descriptionId">{{ text }}</p>
      }
    </div>
    <button
      giddy-button
      variant="ghost"
      iconOnly
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="close()"
    >
      <svg giddy-icon="close"></svg>
    </button>
  </div>
  <div class="dialog__body stack"><ng-content /></div>
  <div class="dialog__footer"><ng-content select="[giddyDialogFooter]" /></div>
</div>
