<label class="field__label" [for]="controlId()"
  >{{ label() }}
  @if (optional()) {
    <span class="optional">(optional)</span>
  }
</label>
<ng-content />
@if (counter(); as count) {
  <span class="field__counter" [id]="counterId()">{{ count }}</span>
}
@if (error(); as text) {
  <span class="field__error" [id]="errorId()">{{ text }}</span>
}
@if (help(); as text) {
  <span class="field__help" [id]="helpId()">{{ text }}</span>
}
