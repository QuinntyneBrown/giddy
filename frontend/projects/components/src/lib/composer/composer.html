<label class="visually-hidden" [for]="inputId">{{ label() }}</label>
<textarea
  #box
  class="textarea"
  rows="1"
  [id]="inputId"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [value]="value()"
  (input)="value.set(box.value)"
  (keydown)="keydown($event)"
></textarea>
@if (busy()) {
  <button
    giddy-button
    type="button"
    iconOnly
    [attr.aria-label]="stopLabel()"
    (click)="stopped.emit()"
  >
    <svg giddy-icon="stop"></svg>
  </button>
} @else {
  <button
    giddy-button
    variant="primary"
    type="submit"
    iconOnly
    [attr.aria-label]="sendLabel()"
    [disabled]="disabled()"
  >
    <svg giddy-icon="send"></svg>
  </button>
}
