<legend>{{ label() }}</legend>
<div class="cluster star-rating__stars">
  @for (star of stars; track star) {
    <button
      giddy-button
      variant="ghost"
      size="sm"
      iconOnly
      type="button"
      [attr.aria-label]="star === 1 ? '1 star' : star + ' stars'"
      [pressed]="value() === star"
      [disabled]="disabled()"
      (click)="rated.emit(star)"
    >
      <span class="rating" [class.star-rating__star--off]="(value() ?? 0) < star">
        <svg giddy-icon="star"></svg>
      </span>
    </button>
  }
</div>
