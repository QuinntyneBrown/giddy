@switch (state()) {
  @case ('expired') {
    <giddy-auth-card
      heading="This link has expired"
      lead="Reset links work for 30 minutes and only once. Ask for a fresh one and you’ll be back in no time."
    >
      <a giddy-button variant="primary" routerLink="/forgot-password">Send a new link</a>
      <a class="text-sm" routerLink="/sign-in">Back to sign in</a>
    </giddy-auth-card>
  }
  @case ('done') {
    <giddy-auth-card
      emoji="🔐"
      heading="Password updated"
      lead="You’re signed in on this device. We’ve signed you out everywhere else, just in case."
    >
      <a giddy-button variant="primary" routerLink="/">Back to planning</a>
    </giddy-auth-card>
  }
  @case ('ready') {
    <giddy-auth-card heading="Choose a new password" [lead]="'For ' + email()">
      @if (problem(); as message) {
        <div giddy-alert tone="danger" heading="That didn’t go through">
          <div>{{ message }}</div>
        </div>
      }
      @if (summaryErrors().length) {
        <giddy-error-summary [errors]="summaryErrors()" />
      }
      <form class="stack" novalidate (submit)="$event.preventDefault(); submit()">
        <giddy-form-field
          label="New password"
          inputId="reset-password"
          help="At least 10 characters with a number or symbol."
          [error]="errors().password ?? null"
        >
          <input
            giddyInput
            type="password"
            autocomplete="new-password"
            [readOnly]="busy()"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
          />
        </giddy-form-field>
        <giddy-form-field
          label="Confirm new password"
          inputId="reset-confirm"
          [error]="errors().confirm ?? null"
        >
          <input
            giddyInput
            type="password"
            autocomplete="new-password"
            [readOnly]="busy()"
            [value]="confirm()"
            (input)="confirm.set($any($event.target).value)"
          />
        </giddy-form-field>
        <button giddy-button variant="primary" type="submit" [busy]="busy()" [disabled]="busy()">
          Save new password
        </button>
      </form>
    </giddy-auth-card>
  }
  @default {
    <giddy-auth-card heading="Checking your link…">
      <giddy-spinner /><span class="visually-hidden">Checking your link</span>
    </giddy-auth-card>
  }
}
