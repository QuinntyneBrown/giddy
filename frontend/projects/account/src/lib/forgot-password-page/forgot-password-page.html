@if (sent()) {
  <giddy-auth-card emoji="📬" heading="Check your inbox">
    <p>
      If there’s an account for <strong>{{ email() }}</strong
      >, a reset link is on its way. It works for 30 minutes.
    </p>
    <a giddy-button routerLink="/sign-in">Back to sign in</a>
    <p class="text-sm">
      Nothing after 5 minutes? Check spam, or
      <button giddy-button variant="link" type="button" (click)="again()">send it again</button>.
    </p>
  </giddy-auth-card>
} @else {
  <giddy-auth-card
    heading="Forgot your password?"
    lead="It happens to the best party planners. We’ll email you a link to set a new one."
  >
    @if (problem(); as message) {
      <div giddy-alert tone="danger" [heading]="message.heading">
        <div>{{ message.text }}</div>
      </div>
    }
    <form class="stack" novalidate (submit)="$event.preventDefault(); submit()">
      <giddy-form-field label="Email" inputId="forgot-email" [error]="error()">
        <input
          giddyInput
          type="email"
          autocomplete="email"
          [readOnly]="busy()"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </giddy-form-field>
      <button giddy-button variant="primary" type="submit" [busy]="busy()" [disabled]="busy()">
        Email me a reset link
      </button>
    </form>
    <a class="text-sm" routerLink="/sign-in">Back to sign in</a>
  </giddy-auth-card>
}
